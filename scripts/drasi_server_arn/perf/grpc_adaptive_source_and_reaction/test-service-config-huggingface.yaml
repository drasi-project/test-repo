# E2E Test Framework Test Service Configuration for ARN Adaptive gRPC Performance Test
# This configuration uses Hugging Face as the test data source

# Data Store Configuration
data_store:
  data_store_path: ./test_data_cache              # Cache location (overridden by --data flag)
  delete_on_start: true                           # Clean cache before test starts
  delete_on_stop: true                            # Clean cache after test completes

  # Test Repository Definitions
  test_repos:
    # Hugging Face Test Repository (fetches test definitions from Hugging Face)
    - id: huggingface_perf_repo                   # Unique repository identifier
      kind: HuggingFace                           # Repository type: HuggingFace
      organization: project-drasi                 # Hugging Face organization
      dataset: arn_inline                         # Hugging Face dataset name
      revision: main                              # Dataset revision (branch/tag)
      root_path: "."                              # Path within dataset to test files (. = root, avoids leading slash)
      force_cache_refresh: true                   # Always fetch latest from Hugging Face
      # token: hf_yourtoken                       # Hugging Face token (optional) - Uncomment and add your token for higher rate limits

# Test Run Configuration
test_run_host:
  test_runs:
    # Test Run Instance
    - test_id: arn_inline_grpc_adaptive           # Test file name (without .test extension)
      test_repo_id: huggingface_perf_repo         # Which test repository to use
      test_run_id: test_run_001                   # Unique identifier for this test run

      # Sources from the Test Definition to include in this test run
      sources:
        - test_source_id: arn-db                  # References source in test definition
          start_mode: auto                        # Start immediately: auto, manual

      # Query Configuration (usually empty - defined in test file)
      queries: []

      # Reactions from the Test Definition to include in this test run
      reactions:
        - test_reaction_id: arn-inline-reaction   # References reaction in test definition
          start_immediately: true                 # Start listening for results immediately

          # Output Loggers (PERF: Only PerformanceMetrics, NO JsonlFile)
          output_loggers:                         # What to log from this reaction
            - kind: PerformanceMetrics            # Log performance metrics (throughput, latency)
